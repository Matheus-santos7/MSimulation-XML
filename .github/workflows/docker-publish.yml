# Builda e publica as imagens Docker no GitHub Container Registry (ghcr.io). O servidor do
# cliente não tem o código: só o infra/docker/docker-compose.yml, que baixa estas imagens.
#
# Versão = tag do git. Para lançar uma versão:
#   git tag v1.4.0 && git push origin v1.4.0
# publica, para backend, frontend e fiscal-validator:
#   :1.4.0  :1.4  :latest  (latest = última versão lançada; é o que o servidor puxa)
# Push em main publica só :main e :sha-<curto> (para testar), sem mexer no :latest.
#
# Variável de repositório (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY: chave pública do Turnstile, embutida no build do frontend.

name: Docker publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            dockerfile: infra/docker/backend.Dockerfile
            no-cache: false
          - name: frontend
            dockerfile: infra/docker/frontend.Dockerfile
            # NEXT_PUBLIC_* entra no bundle: cache poderia reaproveitar uma chave antiga.
            no-cache: true
          - name: fiscal-validator
            dockerfile: infra/fiscal-validator-proxy/Dockerfile
            no-cache: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/matheus-santos7/msimulation-xml-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          no-cache: ${{ matrix.no-cache }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
