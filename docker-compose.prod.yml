# Stack de produção (servidor Linux): backend + frontend + caddy (TLS).
#
# Banco de dados: backend conecta direto no Postgres gerenciado (Neon) via
# DATABASE_URL em backend/.env — mesma base usada pelo Render. Não há um
# serviço de Postgres neste compose.
#
# As imagens de backend/frontend são publicadas no ghcr.io pelo workflow
# .github/workflows/docker-publish.yml (push em main ou manual) — este compose
# só baixa (`pull_policy: always`), nunca builda localmente.
#
# Uso:
#   cp .env.prod.example .env.prod
#   # editar backend/.env e frontend/.env.local com os segredos de produção
#   docker login ghcr.io -u <usuario-github>   # uma vez (ver docs/deploy-docker-aws.md)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# DNS (Route53): registros A de API_DOMAIN e APP_DOMAIN apontando para o IP do servidor.
# Security group: liberar as portas 80 e 443 (TCP) de entrada.
# O Caddy obtém e renova os certificados Let's Encrypt automaticamente (HTTP-01 na porta 80).

services:
  backend:
    image: ghcr.io/matheus-santos7/msimulation-xml-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: msimulation-xml-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      HOST: 0.0.0.0
    # Porta do backend, separada da do frontend — acesso direto só via loopback (debug/SSH tunnel).
    # O tráfego público chega pelo Caddy (API_DOMAIN), via rede interna do compose.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"

  frontend:
    image: ghcr.io/matheus-santos7/msimulation-xml-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: msimulation-xml-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # BFF server-side: fala com o backend pela rede interna do compose, não pelo domínio público.
      API_URL: http://backend:3001
    # Porta do frontend, separada da do backend — acesso direto só via loopback (debug/SSH tunnel).
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: msimulation-xml-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
    name: msimulation-xml-caddy-data
  caddy_config:
    name: msimulation-xml-caddy-config
