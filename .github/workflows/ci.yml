name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Postgres descartável das specs de integração (migrations inteiras, RLS incluída).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: msimulation_xml_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d msimulation_xml_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Prisma 7 carrega prisma.config.ts no generate; só as specs de integração conectam.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/msimulation_xml_ci?schema=public
      INTEGRATION_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/msimulation_xml_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Lint backend
        run: pnpm --filter @msimulation-xml/backend lint

      - name: Build backend packages
        run: pnpm --filter @msimulation-xml/fiscal-core build && pnpm --filter @msimulation-xml/nfe-xml build

      - name: Generate Prisma client
        run: pnpm --filter @msimulation-xml/backend exec prisma generate

      - name: Typecheck backend
        run: pnpm --filter @msimulation-xml/backend build

      - name: Typecheck backend tests
        run: pnpm --filter @msimulation-xml/backend exec tsc --noEmit -p tsconfig.test.json

      - name: Check dependencies
        run: pnpm depcheck

      - name: Backend tests
        run: pnpm test:backend

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
