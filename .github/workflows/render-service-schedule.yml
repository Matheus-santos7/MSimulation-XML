name: Render service schedule

on:
  schedule:
    - cron: "40 10 * * 1-5" # 07:40 BRT -> Resume
    - cron: "30 23 * * 1-5" # 20:30 BRT -> Suspend
  workflow_dispatch:
    inputs:
      action:
        description: "resume = ligar · suspend = desligar"
        required: true
        type: choice
        options:
          - resume
          - suspend

concurrency:
  group: render-service-schedule
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      # Substitua pelos seus IDs reais do Render
      RENDER_SERVICE_IDS: srv-d8jhh4m7r5hc73dt2d9g srv-d8rghournols73fder4g
    steps:
      - name: Resolve action
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            action="${{ inputs.action }}"
          elif [ "${{ github.event.schedule }}" = "40 10 * * 1-5" ]; then
            action="resume"
          elif [ "${{ github.event.schedule }}" = "30 23 * * 1-5" ]; then
            action="suspend"
          else
            echo "::error::Cron schedule não mapeado"
            exit 1
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Ação definida: $action"

      - name: Require RENDER_API_KEY
        run: |
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::Secret RENDER_API_KEY ausente."
            exit 1
          fi

      - name: Call Render API
        env:
          ACTION: ${{ steps.resolve.outputs.action }}
        run: |
          set -euo pipefail
          failed=0
          for service_id in $RENDER_SERVICE_IDS; do
            echo "→ POST /v1/services/${service_id}/${ACTION}"
            http_code="$(curl -sS -o /tmp/render-body.txt -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/${service_id}/${ACTION}")"
            
            echo "HTTP ${http_code}"
            cat /tmp/render-body.txt || true
            echo
            
            # Aceita 202, 200 ou 400 (caso o plano free bloqueie o suspend) para não travar
            if [ "$http_code" != "202" ] && [ "$http_code" != "200" ] && [ "$http_code" != "400" ]; then
              echo "::warning::Falha em ${service_id} (${ACTION}): HTTP ${http_code}"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Warm API after resume
        if: steps.resolve.outputs.action == 'resume'
        env:
          API_HEALTH_URL: https://msimulation-xml-api.onrender.com/api/health
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/health-body.txt -w "%{http_code}" \
              --connect-timeout 10 --max-time 30 \
              "$API_HEALTH_URL" || true)"
            echo "tentativa $i → HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "API Acordada com sucesso!"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::API ainda não respondeu 200 após resume."
