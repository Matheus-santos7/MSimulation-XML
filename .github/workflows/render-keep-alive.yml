# Mantém a API free do Render acordada no horário comercial (spin-down ~15 min).
# Ping externo via GitHub Actions — não consome um segundo serviço no Render.
#
# Só roda seg–sex ~08:00–19:59 BRT (UTC 11–22), alinhado ao
# render-service-schedule.yml (ligado 07:40–20:30 BRT). Fora disso a API está
# suspensa e o ping falharia de propósito.
#
# Limitações conhecidas:
# - Após resume/deploy ainda pode haver cold start até o próximo ping.
# - Em repos privados, schedules do Actions podem atrasar se o repo ficar inativo.
# - workflow_dispatch: Actions → "Render keep-alive" → Run workflow para testar.

name: Render keep-alive

on:
  schedule:
    # */5 entre 11–22 UTC = 08:00–19:59 BRT, seg–sex.
    - cron: "*/5 11-22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  ping-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API /api/health
        env:
          API_HEALTH_URL: https://msimulation-xml-api.onrender.com/api/health
        run: |
          set -euo pipefail
          # max-time alto: se a API dormiu, o próprio ping paga o cold start.
          http_code="$(curl -sS -o /tmp/health-body.txt -w "%{http_code}" \
            --connect-timeout 15 --max-time 120 \
            "$API_HEALTH_URL")"
          echo "HTTP $http_code"
          cat /tmp/health-body.txt
          echo
          test "$http_code" = "200"
