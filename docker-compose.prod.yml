# Stack de produção (servidor Linux): backend + frontend.
#
# TLS/domínio: NÃO é feito por este compose. O servidor (implantacao.nerus1)
# tem um proxy/load balancer compartilhado, gerenciado pela infra, que já
# possui as portas 80/443 e decide o roteamento por domínio → porta fixa:
#   app.msimulation-xml.nerus.com.br → porta 5000 (frontend)
#   api.msimulation-xml.nerus.com.br → porta 5001 (backend)
# Esse mapeamento de domínio/porta é configurado no proxy da infra, fora
# deste repositório — aqui só garantimos que os containers escutam nessas
# portas fixas.
#
# Banco de dados: backend conecta direto no Postgres gerenciado (Neon) via
# DATABASE_URL em backend/.env — mesma base usada pelo Render. Não há um
# serviço de Postgres neste compose.
#
# As imagens de backend/frontend são publicadas no ghcr.io pelo workflow
# .github/workflows/docker-publish.yml (push em main ou manual) — este compose
# só baixa (`pull_policy: always`), nunca builda localmente.
#
# Uso:
#   cp .env.prod.example .env.prod
#   # editar backend/.env e frontend/.env.local com os segredos de produção
#   docker login ghcr.io -u <usuario-github>   # uma vez (ver docs/deploy-docker-aws.md)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

services:
  backend:
    image: ghcr.io/matheus-santos7/msimulation-xml-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: msimulation-xml-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      HOST: 0.0.0.0
    # Porta fixa esperada pelo proxy compartilhado da infra (api. → 5001).
    ports:
      - "${BACKEND_PORT:-5001}:3001"

  frontend:
    image: ghcr.io/matheus-santos7/msimulation-xml-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: msimulation-xml-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # BFF server-side: fala com o backend pela rede interna do compose, não pelo domínio público.
      API_URL: http://backend:3001
    # Porta fixa esperada pelo proxy compartilhado da infra (app. → 5000).
    ports:
      - "${FRONTEND_PORT:-5000}:3000"
    depends_on:
      - backend
