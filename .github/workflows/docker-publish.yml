# Builda e publica as imagens Docker (backend + frontend) no GitHub Container
# Registry (ghcr.io), para o servidor de produção dar só `docker compose pull`.
#
# Gatilhos: push em main (deploy real) ou manual (Actions → "Docker publish" →
# Run workflow, escolhendo a branch — útil para testar antes do merge).
#
# Imagens publicadas:
#   ghcr.io/matheus-santos7/msimulation-xml-backend:latest  + :<sha curto>
#   ghcr.io/matheus-santos7/msimulation-xml-frontend:latest + :<sha curto>
#
# Pré-requisito (uma vez, no servidor): autenticar no ghcr.io para poder puxar
# as imagens (ver docs/deploy-docker-aws.md).
#
# Variável de repositório (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY (opcional — chave pública do Turnstile, embutida
#   no build do frontend; não é segredo, por isso fica em "Variables", não "Secrets").

name: Docker publish

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/matheus-santos7/msimulation-xml-backend
  IMAGE_FRONTEND: ghcr.io/matheus-santos7/msimulation-xml-frontend

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
