# Blueprint Render — API Fastify + PostgreSQL + Validador MCP
# Docs: https://render.com/docs/blueprint-spec
#
# IMPORTANTE: alterar este arquivo NÃO cria serviços automaticamente se o projeto
# já existia no Render. Para novos recursos:
#   1) Dashboard → Blueprints → Sync (se houver blueprint), OU
#   2) Criar manualmente o web service do validador (ver README / instruções abaixo).
#
# Deploy automático: push na branch `main` dispara build + deploy (autoDeployTrigger).
# Frontend em produção: https://msimulation-xml.vercel.app
#
# Horário free (GitHub Actions → render-service-schedule.yml):
#   Seg–sex 07:40 BRT resume API + validador · 20:30 BRT suspend.
# Keep-alive da API só no expediente: render-keep-alive.yml.

services:
  # Plano free: dorme ~15 min sem tráfego (cold start 30–50s no login).
  # Schedule ligar/desligar: .github/workflows/render-service-schedule.yml
  # Keep-alive da API no expediente: .github/workflows/render-keep-alive.yml
  # Free não recebe rede privada → FISCAL_VALIDATOR_URL usa URL pública (.onrender.com).
  # Validador MCP — criar manualmente se não existir após sync do blueprint.
  - type: web
    name: msimulation-xml-fiscal-validator
    runtime: docker
    repo: https://github.com/Matheus-santos7/MSimulation-XML
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile.fiscal-validator
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MCP_FISCAL_LOG_LEVEL
        value: INFO

  - type: web
    name: msimulation-xml-api
    runtime: docker
    repo: https://github.com/Matheus-santos7/MSimulation-XML
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: msimulation-xml-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: CORS_ORIGINS
        value: https://msimulation-xml.vercel.app
      - key: APP_PUBLIC_URL
        value: https://msimulation-xml.vercel.app
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: msimulationxml@gmail.com
      - key: BREVO_SENDER_NAME
        value: MSimulation XML
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: FISCAL_VALIDATOR_ENABLED
        value: "true"
      # URL pública: free web service não recebe tráfego de rede privada (hostport).
      - key: FISCAL_VALIDATOR_URL
        value: https://msimulation-xml-fiscal-validator.onrender.com

databases:
  - name: msimulation-xml-db
    plan: basic-256mb
    databaseName: msimulation_xml
    user: msimulation
